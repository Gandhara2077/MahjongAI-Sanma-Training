# Direct three-player-table evaluation: one 46.5k champion versus two original baselines.
# Run from Mortal/ with MORTAL_CFG set to this file.

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[1v2]
seed_key = 20260907
games_per_iter = 600
iters = 5
log_dir = 'training/sanma_1v2_champion46k_vs_two_baselines_20260907'
pts = [90, 0, -90]

[1v2.challenger]
device = 'cuda:0'
name = 'sanma-128x8-champion-46k'
state_file = '../baselines/sanma_champion_128x8_46500_20260831.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v2.champion]
device = 'cuda:0'
name = 'mortal-baseline'
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true
