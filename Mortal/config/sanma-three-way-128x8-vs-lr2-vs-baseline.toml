# Direct head-to-head: the new from-scratch champion vs the prior champion
# vs the original baseline, all three at the same table with seat rotation.
# Run from Mortal/ with MORTAL_CFG set to this file:
# python mortal/three_way.py

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[three_way]
seed_key = 20260903
games_per_iter = 600
iters = 5
log_dir = 'training/three_way_128x8_lr2_baseline'
pts = [90, 0, -90]

[[three_way.candidates]]
name = 'sanma-128x8-46k'
device = 'cuda:0'
state_file = 'training/sanma_128x8_mortal3p.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[[three_way.candidates]]
name = 'sanma-lr2-40k'
device = 'cuda:0'
state_file = '../baselines/sanma_champion_lr2_40k_20260830.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[[three_way.candidates]]
name = 'mortal-baseline-original'
device = 'cuda:0'
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true
