# From-scratch 192x12 capacity experiment, phase 1.
# Phase 1 runs 46,500 steps. The auto runner may resume this state to 93,000
# steps after evaluation if validation loss does not show material degradation.
# Start from Mortal/mortal with MORTAL_CFG set to this file.

[control]
version = 4
online = false
state_file = 'training/sanma_192x12_train_state.pth'
best_state_file = 'training/sanma_192x12_best_train_state.pth'
deployment_file = 'training/sanma_192x12_mortal3p.pth'
best_deployment_file = 'training/sanma_192x12_best_mortal3p.pth'
tensorboard_dir = 'training/sanma_192x12_tensorboard'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = false
batch_size = 1024
opt_step_every = 1
save_every = 500
test_every = 4000
submit_every = 500
max_steps = 46500
snapshot_every = 2500
snapshot_dir = 'training/sanma_192x12_snapshots'
random_seed = 20260902
val_loss_every = 2000
val_max_batches = 50

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[test_play]
games = 300
log_dir = 'training/sanma_192x12_test_play'
pts = [90, 0, -90]

[train_play.default]
games = 9999
log_dir = 'training/sanma_192x12_train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'

[dataset]
native_version = 5
# Native sanma metadata is used, while the default sanma observation path
# remains compat_v4 until the Rust 775-row parity gate passes.
globs = [
    '../koromo/mjson/2026/0[1-6]/**/*.mjson',
    '../koromo/mjson/2026/07/0[1-9]/**/*.mjson',
    '../koromo/mjson/2026/07/1[0-9]/**/*.mjson',
    '../koromo/mjson/2026/07/2[0-4]/**/*.mjson',
    '../koromo/mjson/2026/08/0[89]/**/*.mjson',
    '../koromo/mjson/2026/08/1[0-9]/**/*.mjson',
    '../koromo/mjson/2026/08/2[0-9]/**/*.mjson',
]
file_index = 'training/sanma_192x12_file_index.pth'
file_batch_size = 8
reserve_ratio = 0.0
num_workers = 8
player_names_files = []
num_epochs = 1
enable_augmentation = true
augmented_first = false
# Held-out validation loss window, never trained on.
val_globs = [
    '../koromo/mjson/2026/07/2[5-9]/**/*.mjson',
    '../koromo/mjson/2026/07/3[0-1]/**/*.mjson',
    '../koromo/mjson/2026/08/0[1-7]/**/*.mjson',
]

[env]
gamma = 1.0
pts = [6.0, 3.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 12

[cql]
min_q_weight = 5.0

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0

[optim.scheduler]
peak = 1e-4
final = 1e-5
warm_up_steps = 1000
max_steps = 46500

[online_training]
phase_start_step = 0
expert_ratio = 0.0
brain_freeze_updates = 0

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = 'training/sanma_192x12_online_buffer'
drain_dir = 'training/sanma_192x12_online_drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[grp]
state_file = '../baselines/sanma_grp_10k_last_frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'training/sanma_192x12_grp_tensorboard'
best_state_file = 'training/sanma_192x12_best_grp.pth'
metrics_file = 'training/sanma_192x12_grp_metrics.json'
early_stopping_patience = 5
early_stopping_min_delta = 1e-4
selection_metric = 'expected_pt_mse'
batch_size = 128
save_every = 100
max_steps = 10000

[grp.dataset]
train_globs = [
    '../koromo/mjson/2026/0[1-6]/**/*.mjson',
    '../koromo/mjson/2026/07/0[1-9]/**/*.mjson',
    '../koromo/mjson/2026/07/1[0-9]/**/*.mjson',
    '../koromo/mjson/2026/07/2[0-4]/**/*.mjson',
]
val_globs = [
    '../koromo/mjson/2026/07/2[5-9]/**/*.mjson',
    '../koromo/mjson/2026/07/3[0-1]/**/*.mjson',
    '../koromo/mjson/2026/08/0[1-7]/**/*.mjson',
]
file_index = 'training/sanma_192x12_grp_file_index.pth'
file_batch_size = 32

[grp.optim]
lr = 1e-5

[1v2]
seed_key = 20260908
games_per_iter = 600
iters = 1
log_dir = 'training/sanma_1v2_192x12'
pts = [90, 0, -90]

[1v2.challenger]
device = 'cuda:0'
name = 'sanma-192x12'
state_file = 'training/sanma_192x12_mortal3p.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v2.champion]
device = 'cuda:0'
name = 'mortal-baseline'
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true
