# Approximate phase comparison: nearest archived phase-1 snapshot (45,000)
# versus the final phase-2 deployment (93,000). The exact 46,500-step
# phase-1 deployment was overwritten because no snapshot was saved at 46,500.

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[1v2]
seed_key = 20260915
games_per_iter = 600
iters = 5
log_dir = 'training/sanma_1v2_192x12_phase1_45k_vs_phase2_93k_20260915'
pts = [90, 0, -90]

[1v2.challenger]
device = 'cuda:0'
name = 'sanma-192x12-phase1-nearest-45k'
state_file = 'training/sanma_192x12_snapshots/mortal_step45000.pth'
