# From-scratch 256x16 capacity experiment on the native_v4 observation path.
# This is the first full training run served by the Rust encoder; one epoch
# (46,500 steps, same budget as the 192x12 phase-1 run for comparability).
# Start from Mortal/mortal with MORTAL_CFG set to this file.

[control]
version = 4
online = false
state_file = 'training/sanma_256x16_train_state.pth'
best_state_file = 'training/sanma_256x16_best_train_state.pth'
deployment_file = 'training/sanma_256x16_mortal3p.pth'
best_deployment_file = 'training/sanma_256x16_best_mortal3p.pth'
tensorboard_dir = 'training/sanma_256x16_tensorboard'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = false
batch_size = 1024
opt_step_every = 1
save_every = 500
test_every = 4000
submit_every = 500
max_steps = 46500
snapshot_every = 2500
snapshot_dir = 'training/sanma_256x16_snapshots'
random_seed = 20260906
# Val evaluation disabled: spawning a second DataLoader worker set mid-run
# killed training twice on this Windows/ROCm host (OpenBLAS OOM at step 2000,
# torch_hip.dll init failure at step 4000). Training-trend monitoring falls
# back to test_play; strength verdicts come from post-training 1v2 panels.
val_loss_every = 0
val_max_batches = 25

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[test_play]
games = 300
log_dir = 'training/sanma_256x16_test_play'
pts = [90, 0, -90]

[train_play.default]
games = 9999
log_dir = 'training/sanma_256x16_train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'

[dataset]
# First production training run on the Rust v4 encoder (bit-exact vs the
# frozen reference; see reports/native-v4-rollout-20260906.md).
observation_encoder = 'native_v4'
globs = [
    '../koromo/mjson/2026/0[1-6]/**/*.mjson',
    '../koromo/mjson/2026/07/0[1-9]/**/*.mjson',
    '../koromo/mjson/2026/07/1[0-9]/**/*.mjson',
    '../koromo/mjson/2026/07/2[0-4]/**/*.mjson',
    '../koromo/mjson/2026/08/0[89]/**/*.mjson',
    '../koromo/mjson/2026/08/1[0-9]/**/*.mjson',
    '../koromo/mjson/2026/08/2[0-9]/**/*.mjson',
]
# Shared, model-independent file list; identical corpus to the 192x12 run.
file_index = 'training/sanma_192x12_file_index.pth'
file_batch_size = 8
reserve_ratio = 0.0
num_workers = 8
player_names_files = []
num_epochs = 1
enable_augmentation = true
augmented_first = false
# Held-out validation loss window, never trained on.
val_globs = [
    '../koromo/mjson/2026/07/2[5-9]/**/*.mjson',
    '../koromo/mjson/2026/07/3[0-1]/**/*.mjson',
    '../koromo/mjson/2026/08/0[1-7]/**/*.mjson',
]

[env]
gamma = 1.0
pts = [6.0, 3.0, 0.0]

[resnet]
conv_channels = 256
num_blocks = 16

[cql]
min_q_weight = 5.0

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 1.0

[optim.scheduler]
peak = 1e-4
final = 1e-5
warm_up_steps = 1000
max_steps = 46500

[online_training]
phase_start_step = 0
expert_ratio = 0.0
brain_freeze_updates = 0

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = 'training/sanma_256x16_online_buffer'
drain_dir = 'training/sanma_256x16_online_drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[grp]
state_file = '../baselines/sanma_grp_10k_last_frozen.pth'

[grp.network]
hidden_size = 64
num_layers = 2
