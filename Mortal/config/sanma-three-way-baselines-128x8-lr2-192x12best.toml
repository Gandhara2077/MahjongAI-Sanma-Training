# Three-way baseline archive evaluation.
# Candidates are the three archived trained models; the original baseline is
# intentionally excluded from this comparison.

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[three_way]
seed_key = 20260918
games_per_iter = 600
iters = 5
log_dir = 'training/sanma_three_way_baselines_128x8_lr2_192x12best_20260918'
pts = [90, 0, -90]

[[three_way.candidates]]
name = 'sanma-128x8-champion-46k'
device = 'cuda:0'
state_file = '../baselines/sanma_champion_128x8_46500_20260831.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[[three_way.candidates]]
name = 'sanma-lr2-champion-40k'
device = 'cuda:0'
state_file = '../baselines/sanma_champion_lr2_40k_20260830.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[[three_way.candidates]]
name = 'sanma-192x12-best-92k'
device = 'cuda:0'
state_file = '../baselines/sanma_champion_192x12_best_92000.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true
