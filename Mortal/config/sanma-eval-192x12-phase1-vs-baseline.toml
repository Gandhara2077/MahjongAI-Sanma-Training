# Phase-1 evaluation: 192x12 candidate versus the original baseline.

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[1v2]
seed_key = 20260910
games_per_iter = 600
iters = 5
log_dir = 'training/sanma_1v2_192x12_phase1_vs_baseline_20260910'
pts = [90, 0, -90]

[1v2.challenger]
device = 'cuda:0'
name = 'sanma-192x12-phase1-46k'
state_file = 'training/sanma_192x12_mortal3p.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v2.champion]
device = 'cuda:0'
name = 'mortal-baseline'
state_file = '../baselines/sanma_baseline_mortal3p_original.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true
