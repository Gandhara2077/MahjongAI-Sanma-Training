# Minimal end-to-end sanma smoke configuration.
# This validates the ROCm/native/replay/checkpoint path; it is not a quality run.

[control]
version = 4
online = false
state_file = 'training/smoke_train_state.pth'
best_state_file = 'training/smoke_best_train_state.pth'
deployment_file = 'training/smoke_mortal3p.pth'
best_deployment_file = 'training/smoke_best_mortal3p.pth'
init_from = '../.cache/models/mortal3p.pth'
tensorboard_dir = 'training/smoke_tensorboard'
device = 'cuda:0'
enable_cudnn_benchmark = false
enable_amp = true
enable_compile = false
batch_size = 32
opt_step_every = 1
save_every = 1
test_every = 1000
submit_every = 1
max_steps = 2
random_seed = 20260829

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 1

[test_play]
games = 3
log_dir = 'training/smoke_test_play'
pts = [90, 0, -90]

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '../.cache/models/mortal3p.pth'

[dataset]
native_version = 5
globs = ['../koromo/mjson/**/*.mjson']
file_index = 'training/smoke_file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 0
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

[env]
gamma = 1.0
pts = [6.0, 3.0, 0.0]

[resnet]
conv_channels = 32
num_blocks = 2

[cql]
min_q_weight = 5.0

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0.0

[optim.scheduler]
peak = 1e-6
final = 1e-6
warm_up_steps = 1
max_steps = 2

[online_training]
phase_start_step = 0
expert_ratio = 0.0
brain_freeze_updates = 0

[online.remote]
host = '127.0.0.1'
port = 5000

[1v2]
seed_key = 20260829
games_per_iter = 3
iters = 1
log_dir = 'training/smoke_1v2'
pts = [90, 0, -90]

[1v2.challenger]
device = 'cuda:0'
name = 'smoke'
state_file = 'training/smoke_mortal3p.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v2.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '../.cache/models/mortal3p.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[grp]
state_file = 'training/smoke_grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = false
tensorboard_dir = 'training/smoke_grp_tensorboard'
best_state_file = 'training/smoke_best_grp.pth'
metrics_file = 'training/smoke_grp_metrics.json'
early_stopping_patience = 0
early_stopping_min_delta = 0.0
selection_metric = 'expected_pt_mse'
batch_size = 8
save_every = 1
max_steps = 1

[grp.dataset]
train_globs = ['../koromo/mjson/**/*.mjson']
val_globs = ['../koromo/mjson/**/*.mjson']
file_index = 'training/smoke_grp_file_index.pth'
file_batch_size = 1

[grp.optim]
lr = 1e-5
