# Direct three-way comparison: 32k best, 46.5k champion, and prior LR2 champion.
# Run from Mortal/ with MORTAL_CFG set to this file.

[compat]
libriichi3p = '../.cache/libriichi3p/libriichi3p-3.12-x86_64-pc-windows-msvc.pyd'
max_workers = 16

[three_way]
seed_key = 20260906
games_per_iter = 600
iters = 5
log_dir = 'training/sanma_three_way_best32k_champion46k_lr2_20260906'
pts = [90, 0, -90]

[[three_way.candidates]]
name = 'sanma-128x8-best-32k'
device = 'cuda:0'
state_file = 'training/sanma_128x8_best_mortal3p.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[[three_way.candidates]]
name = 'sanma-128x8-champion-46k'
device = 'cuda:0'
state_file = '../baselines/sanma_champion_128x8_46500_20260831.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[[three_way.candidates]]
name = 'sanma-lr2-champion-40k'
device = 'cuda:0'
state_file = '../baselines/sanma_champion_lr2_40k_20260830.pth'
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true
